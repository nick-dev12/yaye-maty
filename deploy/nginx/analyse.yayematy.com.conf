# Fichier custom Webuzo — NE PAS mettre de "location /" ici (doublon avec webuzoVH.conf).
# Chemin sur le VPS : /var/webuzo-data/nginx/custom/domains/analyse.yayematy.com.conf

location ^~ /static/ {
    alias /home/colobanes/analyse.yayematy.com/staticfiles/;
    expires 30d;
    access_log off;
}

location ~ /\.git {
    deny all;
}
