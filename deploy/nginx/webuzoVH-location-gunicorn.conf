# Snippet à coller dans webuzoVH.conf pour CHAQUE bloc server analyse.yayematy.com
# (port 80 et port 443). Remplace le bloc "location /" Apache + proxy_cache.
#
# Fichier cible : /usr/local/apps/nginx/etc/conf.d/webuzoVH.conf
# ⚠ Webuzo peut régénérer ce fichier — conserver une sauvegarde .bak

location / {
    proxy_pass http://unix:/home/colobanes/analyse.yayematy.com/gunicorn.sock;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
