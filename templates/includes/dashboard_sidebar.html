{% load static %}
<aside class="sidebar" id="sidebar" aria-label="Navigation principale">
    <div class="sidebar-chrome" aria-hidden="true">
        <span class="sidebar-chrome-dot sidebar-chrome-dot--red"></span>
        <span class="sidebar-chrome-dot sidebar-chrome-dot--yellow"></span>
        <span class="sidebar-chrome-dot sidebar-chrome-dot--green"></span>
    </div>

    <div class="sidebar-header">
        <a href="{% url 'dashboard' %}" class="sidebar-brand sidebar-brand--mobile">
            <span class="sidebar-brand-mark">YM</span>
            <span class="sidebar-brand-text">YAYEMATY</span>
        </a>
        <button class="sidebar-close" id="sidebarClose" type="button" aria-label="Fermer le menu">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
        </button>
    </div>

    <div class="sidebar-scroll">
        <a href="{% url 'dashboard' %}" class="sidebar-brand sidebar-brand--desktop">
            <span class="sidebar-brand-mark">YM</span>
            <span class="sidebar-brand-text">YAYEMATY</span>
        </a>

        <div class="sidebar-search">
            <svg class="sidebar-search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                <circle cx="9" cy="9" r="5.5"/><path stroke-linecap="round" d="M13.5 13.5L17 17"/>
            </svg>
            <input type="search" class="sidebar-search-input" id="sidebarSearch" placeholder="Rechercher…" aria-label="Rechercher dans le menu" autocomplete="off">
        </div>

        <nav class="sidebar-nav" id="sidebarNav">
            <p class="sidebar-section-title">Menu</p>

            <a href="{% url 'dashboard' %}" class="nav-item{% if request.resolver_match.url_name == 'dashboard' %} active{% endif %}" data-nav-label="tableau de bord">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5L10 4l7 6.5M5 9.5V16a1 1 0 001 1h3v-4h2v4h3a1 1 0 001-1V9.5"/></svg>
                <span class="nav-item-label">Tableau de bord</span>
            </a>
            <a href="{% url 'intelligence:domaines' %}" class="nav-item{% if request.resolver_match.namespace == 'intelligence' and request.resolver_match.url_name == 'domaines' %} active{% endif %}" data-nav-label="domaines">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="7"/><path stroke-linecap="round" d="M10 6v4h3"/></svg>
                <span class="nav-item-label">Domaines</span>
            </a>
            <a href="{% url 'intelligence:collecte_test' %}" class="nav-item{% if request.resolver_match.namespace == 'intelligence' and request.resolver_match.url_name == 'collecte_test' %} active{% endif %}" data-nav-label="session test collecte">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M10 4v4l3 2M10 18a8 8 0 100-16 8 8 0 000 16z"/></svg>
                <span class="nav-item-label">Session test</span>
            </a>
            <a href="{% url 'intelligence:index' %}" class="nav-item{% if request.resolver_match.namespace == 'intelligence' and request.resolver_match.url_name == 'index' %} active{% endif %}" data-nav-label="trade intelligence">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M4 15V5m4 10V9m4 6V7m4 8V4"/></svg>
                <span class="nav-item-label">Trade Intelligence</span>
            </a>
            <a href="{% url 'intelligence:import_master' %}" class="nav-item{% if request.resolver_match.namespace == 'intelligence' and request.resolver_match.url_name == 'import_master' %} active{% endif %}" data-nav-label="import master opportunites">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M3 14l4-4 3 3 7-7M13 6h4v4"/></svg>
                <span class="nav-item-label">Import Master</span>
            </a>
            <a href="{% url 'intelligence:archives' %}" class="nav-item{% if request.resolver_match.namespace == 'intelligence' and request.resolver_match.url_name == 'archives' %} active{% endif %}" data-nav-label="archives intelligence">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4h12v4H4V4zm0 6h8v6H4v-6zm10 0h2v6h-2v-6z"/></svg>
                <span class="nav-item-label">Archives</span>
            </a>
            <a href="https://yayematy.com" class="nav-item" data-nav-label="boutique yayematy">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M4 7h12l-1 10H5L4 7z"/><path stroke-linecap="round" d="M8 7V5a2 2 0 014 0v2"/></svg>
                <span class="nav-item-label">Boutique</span>
            </a>
            <a href="{% url 'profile' %}" class="nav-item{% if request.resolver_match.url_name == 'profile' %} active{% endif %}" data-nav-label="profil compte">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="7" r="3.5"/><path stroke-linecap="round" stroke-linejoin="round" d="M4 17c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg>
                <span class="nav-item-label">Profil</span>
            </a>
        </nav>
    </div>

    <div class="sidebar-footer">
        <form method="post" action="{% url 'logout' %}" class="sidebar-logout-form">
            {% csrf_token %}
            <button type="submit" class="nav-item nav-item--logout" data-nav-label="deconnexion">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" d="M7 17H4a1 1 0 01-1-1V4a1 1 0 011-1h3M13 14l4-4m0 0l-4-4m4 4H7"/></svg>
                <span class="nav-item-label">Déconnexion</span>
            </button>
        </form>
        <button type="button" class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="Réduire le menu" aria-pressed="false">
            <svg class="sidebar-collapse-icon sidebar-collapse-icon--expand" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" d="M8 5l-5 5 5 5M13 5l5 5-5 5"/></svg>
            <svg class="sidebar-collapse-icon sidebar-collapse-icon--collapse" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" d="M12 5l5 5-5 5M7 5l-5 5 5 5"/></svg>
        </button>
    </div>
</aside>
